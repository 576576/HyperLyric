name: Announce Stable Release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版 Tag（例如 1937-7.1）
        required: true

permissions:
  contents: read

concurrency:
  group: announce-stable-release
  cancel-in-progress: false

jobs:
  announce:
    name: Send Stable APK to Telegram
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest

    steps:
      - name: 解析 Release Tag Resolve Release Tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_URL: ${{ github.event.release.html_url }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [[ -z "$TAG" ]]; then
            echo '::error::无法确定 Release Tag'
            exit 1
          fi

          URL="${EVENT_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}}"

          {
            echo "tag=$TAG"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: 拉取发布版本文件 Checkout Release Files
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: 下载已发布的 APK Download Release APK
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'HyperLyric-*.apk' \
            --clobber

          find_one_apk() {
            local pattern="$1"
            local label="$2"
            local files=()

            mapfile -t files < <(find release-assets -maxdepth 1 -type f -name "$pattern" -print | sort)
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "::error::$label APK 数量不是 1，实际为 ${#files[@]}"
              printf '%s\n' "${files[@]}"
              exit 1
            fi

            printf '%s' "${files[0]}"
          }

          APK="$(find_one_apk 'HyperLyric-*.apk' HyperLyric)"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 保存正式版 Release 说明 Save Published Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > release-body.md

      - name: 检查 Xposed 仓库令牌 Check Xposed Repository Token
        env:
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${XPOSED_REPO_TOKEN:-}" ]]; then
            echo '::error::缺少 XPOSED_REPO_TOKEN secret'
            exit 1
          fi

      - name: 创建带发布时间的 Xposed Tag Create Dated Xposed Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EVENT_PUBLISHED_AT: ${{ github.event.release.published_at }}
        shell: bash
        run: |
          set -euo pipefail

          XPOSED_REPOSITORY='Xposed-Modules-Repo/com.lidesheng.hyperlyric'
          RELEASE_PUBLISHED_AT="$EVENT_PUBLISHED_AT"

          if [[ -z "$RELEASE_PUBLISHED_AT" ]]; then
            SOURCE_RELEASE="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,publishedAt)"
            if [[ "$(jq -r '.isDraft' <<< "$SOURCE_RELEASE")" != 'false' ]]; then
              echo '::error::只能同步已发布的正式版 Release'
              exit 1
            fi
            if [[ "$(jq -r '.isPrerelease' <<< "$SOURCE_RELEASE")" != 'false' ]]; then
              echo '::error::不能将 Pre-release 同步到 Xposed 仓库'
              exit 1
            fi
            RELEASE_PUBLISHED_AT="$(jq -r '.publishedAt // empty' <<< "$SOURCE_RELEASE")"
          fi

          if [[ -z "$RELEASE_PUBLISHED_AT" ]]; then
            echo '::error::无法读取正式版 Release 的发布时间'
            exit 1
          fi

          MATCHING_REFS="$(GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
            "repos/$XPOSED_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          EXISTING_REF="$(jq -c --arg ref "refs/tags/$RELEASE_TAG" \
            '.[] | select(.ref == $ref)' <<< "$MATCHING_REFS")"

          if [[ -n "$EXISTING_REF" ]]; then
            TARGET_TYPE="$(jq -r '.object.type' <<< "$EXISTING_REF")"
            TARGET_SHA="$(jq -r '.object.sha' <<< "$EXISTING_REF")"

            while [[ "$TARGET_TYPE" == 'tag' ]]; do
              NESTED_TAG="$(GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
                "repos/$XPOSED_REPOSITORY/git/tags/$TARGET_SHA")"
              TARGET_TYPE="$(jq -r '.object.type' <<< "$NESTED_TAG")"
              TARGET_SHA="$(jq -r '.object.sha' <<< "$NESTED_TAG")"
            done

            if [[ "$TARGET_TYPE" != 'commit' ]]; then
              echo "::error::Xposed Tag $RELEASE_TAG 指向非 commit 对象: $TARGET_TYPE"
              exit 1
            fi
          else
            DEFAULT_BRANCH="$(GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
              "repos/$XPOSED_REPOSITORY" --jq '.default_branch')"
            TARGET_SHA="$(GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
              "repos/$XPOSED_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
          fi

          TAG_OBJECT_SHA="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg message "Release $RELEASE_TAG" \
            --arg target "$TARGET_SHA" \
            --arg date "$RELEASE_PUBLISHED_AT" \
            '{tag:$tag,message:$message,object:$target,type:"commit",tagger:{name:"GitHub Actions",email:"github-actions[bot]@users.noreply.github.com",date:$date}}' \
            | GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
              --method POST "repos/$XPOSED_REPOSITORY/git/tags" \
              --input - --jq '.sha')"

          if [[ -n "$EXISTING_REF" ]]; then
            GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
              --method PATCH "repos/$XPOSED_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f "sha=$TAG_OBJECT_SHA" -F force=true > /dev/null
          else
            GH_TOKEN="$XPOSED_REPO_TOKEN" gh api \
              --method POST "repos/$XPOSED_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TAG_OBJECT_SHA" > /dev/null
          fi

          echo "Xposed Tag $RELEASE_TAG now uses the published time $RELEASE_PUBLISHED_AT and commit $TARGET_SHA"

      - name: 同步正式版到 Xposed 仓库 Sync Stable Release to Xposed Repo
        uses: softprops/action-gh-release@v3
        with:
          repository: Xposed-Modules-Repo/com.lidesheng.hyperlyric
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/HyperLyric-*.apk

      - name: 清理 Release 正文 Clean Release Body
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e '/^[[:space:]]*<!--.*-->[[:space:]]*$/d' \
            -e '/^[[:space:]]*<!--[[:space:]]*$/,/^[[:space:]]*-->[[:space:]]*$/d' \
            release-body.md > release-notes-zh.md

      - name: 发送到 Telegram Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_NOTES_ZH_FILE: release-notes-zh.md
          APK: ${{ steps.assets.outputs.apk }}
        shell: bash
        run: bash .github/scripts/send-telegram-release.sh
